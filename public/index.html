<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#00586f">
<meta name="description" content="Wigan Connect helps young people explore careers, work experience and community opportunities through eight accessible questions.">
<title>Wigan Connect · Find your future</title>
<link rel="stylesheet" href="styles.css">
<script defer src="content.js"></script><script defer src="core.js"></script><script defer src="app.js"></script><script defer src="accessibility.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="./" aria-label="Wigan Connect home"><span class="brand-mark" aria-hidden="true">w<span>•</span></span><span>Wigan <strong>Connect</strong></span></a><span class="prototype" id="prototypeLabel">PROTOTYPE</span></div></header>
<div class="access-wrap"><details id="accessPanel"><summary><span aria-hidden="true">🌐</span><strong id="accessTitle">Accessibility & language</strong><span class="access-current" id="currentLanguage">English</span><span aria-hidden="true">⌄</span></summary><div class="access-content"><p id="accessDescription">Choose your language and how to answer.</p><div class="access-grid"><label><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="pl">Polski</option><option value="ur">اردو</option></select></label><div><span class="control-label" id="readLabel">Read or listen</span><button id="listenButton" class="access-button" aria-pressed="false">🔊 Listen</button></div><div><span class="control-label" id="answerLabel">Type or speak</span><div class="input-switch"><button id="typeMode" aria-pressed="true">Type answers</button><button id="voiceMode" aria-pressed="false">Speak answers</button></div></div></div><div class="access-row"><button id="allLanguages" class="text-button">More languages ↗</button><button id="sizeButton" class="access-button" aria-pressed="false">A+ Larger text</button><button id="contrastButton" class="access-button" aria-pressed="false">◐ High contrast</button><label class="speed"><span id="speedLabel">Reading speed</span><select id="speechSpeed"><option value="0.75">0.75×</option><option value="0.95" selected>1×</option><option value="1.2">1.25×</option></select></label></div><p id="translationStatus" class="access-note" role="status"></p><p id="voiceStatus" class="access-note"></p></div></details></div>
<main id="main" tabindex="-1"><div id="app"></div></main>
<footer><div class="footer-inner"><p id="privacyNote"></p><div class="footer-bottom"><span id="ownNote"></span><button id="sourcesButton">Sources & about this demo</button></div></div></footer>
<div id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></div><div id="status" class="status-toast" role="status"></div>
<dialog id="dialog"></dialog>
<noscript><p>Enable JavaScript to use the form, or visit <a href="https://www.wigan.gov.uk/Resident/Jobs-Careers/index.aspx">Wigan Council’s jobs and skills information</a>.</p></noscript>
</body></html>
